[project]
name = "svgreportbuilder"
version = "0.1.0"
description = "Fill fixed SVG templates with text and embedded images."
readme = "README.md"
requires-python = ">=3.13,<3.14"
authors = [
    { name = "caumie", email = "caumie@outlook.jp" },
]
dependencies = []

[dependency-groups]
dev = [
    "mypy>=2,<3",
    "pyright>=1.1,<2",
    "pytest>=8.3.4,<9",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["svgreportbuilder*"]

[tool.mypy]
strict = true
explicit_package_bases = true
files = ["svgreportbuilder", "examples"]

[tool.pyright]
include = ["svgreportbuilder", "examples"]
typeCheckingMode = "strict"
pythonVersion = "3.13"
