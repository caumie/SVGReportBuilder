<svg xmlns="http://www.w3.org/2000/svg" lang="ja" width="210mm" height="148mm" viewBox="0 0 210 148" role="img" aria-labelledby="title description">
  <title id="title">領収書</title>
  <desc id="description">A5横。宛名、領収額、但し書き、税額内訳、支払方法と発行者。上部に発行者のロゴ画像。</desc>
  <style>
    text { font-family: 'Noto Sans CJK JP', 'Noto Sans JP', 'Yu Gothic', 'Hiragino Sans', 'Meiryo', sans-serif; fill: #000; }
    .title { font-size: 6.5px; font-weight: 700; letter-spacing: 1px; }
    .section { font-size: 3.1px; font-weight: 700; }
    .label { font-size: 2.6px; }
    .small { font-size: 2.3px; }
    .line { fill: none; stroke: #000; stroke-width: .22; }
    .heavy { fill: none; stroke: #000; stroke-width: .5; }
    .slot { fill: none; stroke: none; }
  </style>
  <rect width="210" height="148" fill="#fff"/>
  <rect id="issuer_logo_box" class="slot" x="98" y="12" width="26" height="26"/>
  <text class="small" x="12" y="15">R05 / BUSINESS RECORD</text>
  <text class="title" x="12" y="29">領収書</text>
  <text class="label" x="12" y="38">文書区分</text>
  <rect id="document_copy_box" class="slot" x="29" y="32" width="50" height="8"/>
  <rect class="line" x="134" y="12" width="64" height="9"/>
  <text class="label" x="136" y="17.5">文書番号</text>
  <path class="line" d="M 154 12 L 154 21"/>
  <rect id="document_number_box" class="slot" x="154" y="12" width="44" height="9"/>
  <rect class="line" x="134" y="21" width="64" height="9"/>
  <text class="label" x="136" y="26.5">発行日</text>
  <path class="line" d="M 154 21 L 154 30"/>
  <rect id="document_date_box" class="slot" x="154" y="21" width="44" height="9"/>
  <rect class="line" x="134" y="30" width="64" height="9"/>
  <text class="label" x="136" y="35.5">関連番号</text>
  <path class="line" d="M 154 30 L 154 39"/>
  <rect id="reference_number_box" class="slot" x="154" y="30" width="44" height="9"/>
  <path class="heavy" d="M 12 43 H 198"/>
  <path class="line" d="M 12 123 H 198"/>
  <rect class="line" x="12" y="126" width="59" height="12"/>
  <rect id="document_barcode_box" class="slot" x="13" y="127" width="57" height="10"/>
  <text class="small" x="76" y="129">照合ID</text>
  <rect id="document_readable_id_box" class="slot" x="75" y="131" width="75" height="7"/>
  <text class="small" x="176" y="129" text-anchor="middle">頁 / 総頁</text>
  <rect id="page_current_box" class="slot" x="161" y="131" width="12" height="7"/>
  <text class="label" x="176" y="135.5" text-anchor="middle">/</text>
  <rect id="page_total_box" class="slot" x="179" y="131" width="12" height="7"/>
  <text class="label" x="12" y="50">宛名</text>
  <rect id="recipient_name_box" class="slot" x="11" y="52" width="113" height="10"/>
  <rect class="line" x="12" y="66" width="112" height="21"/>
  <text class="label" x="14" y="70.5">領収金額（税込）</text>
  <rect id="received_amount_box" class="slot" x="13" y="72" width="110" height="14"/>
  <rect class="line" x="12" y="91" width="112" height="10"/>
  <text class="label" x="14" y="97">但し書き</text>
  <path class="line" d="M 32 91 L 32 101"/>
  <rect id="purpose_box" class="slot" x="32" y="91" width="92" height="10"/>
  <rect class="line" x="12" y="101" width="112" height="10"/>
  <text class="label" x="14" y="107">支払方法</text>
  <path class="line" d="M 32 101 L 32 111"/>
  <rect id="payment_method_box" class="slot" x="32" y="101" width="92" height="10"/>
  <text class="section" x="132" y="50">発行者</text>
  <rect id="issuer_name_box" class="slot" x="131" y="52" width="67" height="9"/>
  <rect id="issuer_address_box" class="slot" x="131" y="61" width="67" height="13"/>
  <rect id="issuer_contact_box" class="slot" x="131" y="75" width="67" height="7"/>
  <text class="small" x="132" y="87">登録番号</text>
  <rect id="issuer_registration_box" class="slot" x="131" y="88" width="67" height="7"/>
  <rect class="line" x="132" y="99" width="66" height="10"/>
  <text class="label" x="134" y="105">うち消費税</text>
  <path class="line" d="M 155 99 L 155 109"/>
  <rect id="tax_amount_box" class="slot" x="155" y="99" width="43" height="10"/>
  <text class="label" x="12" y="118">上記金額を領収いたしました。</text>
  <text class="small" x="198" y="118" text-anchor="end">税率別内訳：関連番号の明細書を参照</text>
</svg>
